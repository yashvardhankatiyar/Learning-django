{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Notes App</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<div class="container py-5">

    <h1 class="text-center text-4xl font-bold mb-4">📝 Notes App</h1>

    <!-- Add Note -->
    <form method="POST" action="{% url 'add_note' %}" class="mb-4">
        {% csrf_token %}
        <div class="input-group">
            <input type="text" name="title" class="form-control" placeholder="Write a note..." required>
            <button class="btn btn-primary">Add</button>
        </div>
    </form>

    <!-- Notes List -->
    {% for note in notes %}
    <div class="card p-3 mb-2 flex flex-row justify-between items-center">

        <form method="POST" action="{% url 'edit_note' note.id %}" class="flex gap-2 w-75">
            {% csrf_token %}
            <input type="text" name="title" value="{{ note.title }}" class="form-control">
            <button class="btn btn-warning btn-sm">Edit</button>
        </form>

        <form method="POST" action="{% url 'delete_note' note.id %}">
            {% csrf_token %}
            <button class="btn btn-danger btn-sm">Delete</button>
        </form>

    </div>
    {% empty %}
        <p class="text-center text-gray-400">No notes yet ✨</p>
    {% endfor %}

</div>

</body>
</html>
