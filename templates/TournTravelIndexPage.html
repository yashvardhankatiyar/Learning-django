{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Travel Destinations</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">


<!-- 🔹 Top Navbar -->
<div class="bg-white shadow-md">

    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">

       
        <!-- Left → Auth buttons -->
        <div class="flex gap-3 items-center">

            {% if user.is_authenticated %}

                <!-- 👤 Username -->
                <span class="font-semibold text-gray-700">
                    👋 {{ user.username }}
                </span>

                <!-- Logout -->
                <a href="{% url 'logout' %}"
                class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 text-sm font-semibold">
                Logout
                </a>

            {% else %}

                <!-- Register -->
                <a href="{% url 'register' %}"
                class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 text-sm font-semibold">
                Register
                </a>

                <!-- Login -->
                <a href="{% url 'login' %}"
                class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 text-sm font-semibold">
                Login
                </a>

            {% endif %}

        </div>


        <!-- Center → Title -->
        <h1 class="text-2xl font-bold">
            🌍 Travel Destinations
        </h1>

        <!-- Right → empty (for spacing symmetry) -->
        <div></div>

    </div>

</div>



<!-- 🔹 Main Section -->
<div class="max-w-7xl mx-auto p-10">

    <!-- Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">

        {% for dest in dests %}
        <div class="bg-white rounded-2xl shadow-lg overflow-hidden hover:scale-105 transition relative">

            <!-- 🔥 Special Offer Badge -->
            {% if dest.isOffer %}
            <div class="absolute top-3 left-3 bg-red-600 text-white text-xs font-bold px-3 py-1 rounded-full shadow-md z-10 animate-pulse">
                🔥 Special Offer
            </div>
            {% endif %}

            <!-- Image -->
            <img src="{{ dest.img.url }}" class="w-full h-48 object-cover">

            <!-- Content -->
            <div class="p-5">

                <h2 class="text-xl font-semibold mb-2">
                    {{ dest.name }}
                </h2>

                <p class="text-gray-600 mb-4">
                    {{ dest.desc }}
                </p>

                <div class="flex justify-between items-center">

                    <span class="text-lg font-bold text-green-600">
                        ₹{{ dest.price }}
                    </span>

                    <button class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
                        Book Now
                    </button>

                </div>
            </div>
        </div>
        {% endfor %}

    </div>
</div>

</body>
</html>
