<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">

<div class="bg-white shadow-xl rounded-2xl w-full max-w-md p-8">

    <h2 class="text-3xl font-bold text-center mb-6">📝 Create Account</h2>

    <form method="POST" action = "{% url 'register' %}" class="space-y-4">
        {% csrf_token %}

        <input type="text" name="username" placeholder="Username" required
               class="w-full border p-3 rounded-lg">

        <input type="email" name="email" placeholder="Email ID" required
               class="w-full border p-3 rounded-lg">

        <div class="grid grid-cols-2 gap-3">
            <input type="text" name="first_name" placeholder="First Name" required
                   class="border p-3 rounded-lg">

            <input type="text" name="last_name" placeholder="Last Name" required
                   class="border p-3 rounded-lg">
        </div>

        <input type="password" name="password1" placeholder="Password" required
               class="w-full border p-3 rounded-lg">

        <input type="password" name="password2" placeholder="Confirm Password" required
               class="w-full border p-3 rounded-lg">
        
        {% if messages %}
            {% for message in messages %}
            <div class="p-3 rounded-lg {% if message.tags == 'error' %} bg-red-100 text-red-700 {% else %} bg-green-100 text-green-700 {% endif %}">
                {{ message }}
            </div>
            {% endfor %}    
        {% endif %}
        <button class="w-full bg-green-600 text-white py-3 rounded-lg hover:bg-green-700 font-semibold">
            Register
        </button>
    </form>

    <!-- Switch -->
    <p class="text-center mt-5 text-sm">
        Already a user?
        <a href="{% url 'login' %}" class="text-blue-600 font-semibold">Login</a>
    </p>

</div>

</body>
</html>
